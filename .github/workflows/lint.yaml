name: lint

# The gate for this repo. Skills are prose that a model acts on, so the failure
# mode is not a crash — it is a model confidently telling someone to run a flag
# that was removed, or install a package that 404s, or reporting an elided value
# as an absent one. None of that is caught by a compiler, and none of it is
# caught by `claude plugin validate --strict` either: probed against broken
# fixtures it accepts a name/directory mismatch, a 1500-character description,
# unknown frontmatter keys, `../` links, and frontmatter that is not valid YAML.
#
# So scripts/lint_skills.py is the real gate, and scripts/test_lint_skills.py
# proves it still catches each thing it claims to. Both run here.
#
# lint_skills.py catches banned *substrings*, which is the wrong shape for a skill
# that names a tool the server does not ship. The `mcp` job below closes that
# across skills, evals and the README, and fails on any CLI invocation.
#
# And lint_skills.py only ever SIMULATES an install, with `shutil.copytree`. The
# `install` job runs the real `npx skills add` in both of its modes, because the
# installed layout is not a flat copy and because the installer can finish
# successfully having installed the wrong number of skills.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        # A real YAML parser, deliberately. A regex over `description:` cannot
        # tell valid frontmatter from a block that will fail to load in a client.
        run: pip install --quiet pyyaml

      - name: Test the link extractor
        # Runs before the linter's own tests, because the linter now resolves
        # links through scripts/skill_links.py and so does the `install` job
        # below. Two lines of regex holding up two gates: if it stops matching,
        # both report no findings and both look clean.
        run: python3 scripts/test_skill_links.py

      - name: Test the linter
        # Runs first among the linter's own checks: a linter whose tests fail
        # cannot be trusted to gate anything, and a green lint would then be
        # worse than no lint.
        run: python3 scripts/test_lint_skills.py

      - name: Lint the skills
        run: python3 scripts/lint_skills.py

  install:
    # The install path itself, run rather than simulated.
    #
    # `lint_skills.py` has `check_isolation`, which copies each skill alone with
    # `shutil.copytree` and asserts every link resolves. Good gate, still here,
    # not replaced. But it never runs the command the README tells users to run,
    # and the layout that command produces is not a flat copy: in default mode
    # `npx skills` writes the content once into `.agents/skills/<name>/` and
    # makes each other agent directory a symlink into it, so every relative link
    # is resolved THROUGH a symlink. With `--copy` each agent directory gets its
    # own real copy. Two documented modes, one of them tested by proxy and the
    # other not at all.
    #
    # The assertion is a positive count, not an exit status, because those come
    # apart — and they come apart most sharply right here, on a runner. Verified
    # on skills@1.5.22 and 1.5.23:
    #
    #   A root `SKILL.md` shadows the whole `skills/` tree. The installer
    #   reports `Found 1 skill`, installs that one, and exits 0. Nine skills
    #   silently never arrive.
    #
    #   With no terminal to prompt from and no `-y`, it finds the skills,
    #   installs none of them, and exits 0. That is this environment exactly.
    #
    # The count is derived from this repo's own `skills/` directory rather than
    # written down as 10, so adding a skill cannot quietly weaken the gate.
    #
    # The agent list is REPEATED `-a` flags. `-a claude-code,codex,
    # github-copilot` is a different command: both versions read the
    # comma-joined string as one unknown agent name, print `Invalid agents:`,
    # and install nothing.
    #
    # Installed from the local checkout, not from `diagridio/catalyst-ai`, so
    # the job needs no GitHub auth and tests the working tree rather than what
    # is already on main. Node and network are the only requirements — the gate
    # is stdlib Python, so there is nothing to pip install.
    #
    # ubuntu and macos, and deliberately not windows. `npx skills` cannot create
    # a symlink there without Developer Mode or an elevated shell, so default
    # mode either falls back to copying or fails outright; a windows leg would
    # pass vacuously or fail for a reason that says nothing about this repo.
    # `fail-fast: false` because the whole point of two runners is the symlink
    # semantics, and cancelling one the moment the other goes red throws away
    # the comparison. It earned that on the first run: macos went red and ubuntu
    # green, and the difference was the finding.
    #
    # No package cache here, and that is a decision rather than an omission. The whole job runs in under 20s, so
    # there is little to win — and restoring `~/.npm/_npx` from a cache is the
    # closest thing to the failure this job already hit once, where concurrent
    # npx invocations racing on that directory produced `ENOTEMPTY` on macos and
    # npm exited 190. A half-restored tree is exactly what makes npm try to
    # repair it. Trading a real flake for a second or two is a bad trade; the
    # suite warms the cache serially instead, in `warm_npx()`.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test the installer gate
        # Runs first, same reason as the other two suites: a gate nobody has
        # pointed at a broken layout is not a gate. The cases that matter most
        # are the controls — a correct tree in both modes has to come out green,
        # or the rejections below prove only that the checker rejects whatever
        # it is shown.
        run: python3 scripts/test_check_install.py

      - name: Install with the real installer and check what landed
        run: python3 scripts/check_install.py

  mcp:
    # The skills drive Catalyst only through the remote MCP server, so three things
    # are checked across skills/, evals/ and README.md: every `catalyst_*` name is in
    # contracts/catalyst-mcp-tools.txt, no `diagrid <subcommand>` CLI invocation
    # remains, and nothing names a local MCP server or a non-production host.
    # lint_skills.py checks tool names inside skills/ only; this job also covers the
    # evals and the README, and owns the CLI and host rules. Stdlib Python, so there
    # is nothing to install and no secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test the MCP surface gate
        # Runs first: a gate nobody has pointed at a broken fixture is not a gate.
        # The controls must pass, or the rejections prove only that it rejects.
        run: python3 scripts/test_check_mcp_surface.py

      - name: Check the MCP surface
        run: python3 scripts/check_mcp_surface.py

  install-component:
    # web/install/ is the npm package `@diagrid/catalyst-ai-install`. Its data is
    # GENERATED from commands/ and checked against the README, so a command or an
    # install step that changes without regenerating would put stale instructions
    # in front of people on diagrid.io. `--check` fails on that drift. The node tests
    # re-check it independently and assert the data shape.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Generated install data is current and matches the README
        run: python3 scripts/build_install_data.py --check

      - name: Test the component package
        working-directory: web/install
        run: npm test

      - name: The package packs only the intended files
        working-directory: web/install
        run: |
          npm pack --dry-run --json | node -e '
            const files = JSON.parse(require("fs").readFileSync(0, "utf8"))[0].files.map((f) => f.path).sort();
            const want = ["LICENSE","README.md","catalyst-ai-install.d.ts","catalyst-ai-install.js","data.d.ts","data.js","install.json","package.json"];
            if (JSON.stringify(files) !== JSON.stringify(want)) { console.error("unexpected pack list:", files); process.exit(1); }
            console.log("packs:", files.join(", "));
          '

  version:
    # A change to plugin content that does not move `version` ships to nobody.
    # Claude Code caches an installed plugin under its declared version at
    # ~/.claude/plugins/cache/<marketplace>/<plugin>/<version>/ and does NOT
    # repopulate a version directory it already has. Measured on this repo, same
    # remote and same commit both times: with a stale 0.1.0 cache present, 1 of 9
    # skills registered; with it deleted, all 9. There is no error and nothing in
    # the UI — the only symptom is a skill that never fires.
    #
    # Pull requests only. On a push to main the merge base is HEAD, so there is
    # nothing to compare and the check would be a no-op anyway.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The gate needs a merge base, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test the version gate
        run: python3 scripts/test_check_version_bump.py

      - name: Require a version bump for plugin changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_version_bump.py "origin/$BASE_REF"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate the plugin and marketplace manifests
        # Kept as a weak extra signal, not as the gate — see the note above. It
        # does catch a malformed manifest, which the Python linter does not read.
        # Pinned, as check_install.py pins `skills`, so an upstream release cannot
        # change this job's verdict without a change in this repo.
        run: npx --yes @anthropic-ai/claude-code@2.1.286 plugin validate . --strict
